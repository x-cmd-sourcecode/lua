---
make:
  make 命令: 
    - "[环境变量] make [参数] [构建选项] [目标]"
    - 构建选项:
      - -f <file-path>：指定 Makefile 文件
      - -C <directory>：指定 Makefile 工作目录
      - -s：静默模式
      - -n：只输出要执行的命令，但是不执行
      - -B：强制执行所有的目标
  makefile:
    语法: |
        # 如果Make命令运行时没有指定目标，默认会执行Makefile文件的第一个目标
        # 前置条件：通常是一组文件名，之间用空格分隔
        # 构建命令：表示如何更新目标文件，由一行或多行的Shell命令组成（注意，每行命令在一个单独的shell中执行。这些Shell之间没有继承关系。）
        [<自定义变量> = <值>]
        [<自定义变量1> = $(<自定义变量2>)]     # =, :=, ?=, +=
        [<自定义变量1> = ${<自定义变量2>}]
        <目标>: [前置条件]
            [构建命令]

        # 判断
        ifeq ($(CC),gcc)
          libs=$(libs_for_gcc)
        else
          libs=$(normal_libs)
        endif
        # 循环
        LIST = one two three
        all:
            for i in $(LIST); do \
                echo $$i; \
            done

        # 内置变量
        [.PHONY: <伪目标>] 
        [.ONESHELL]
        [$(CC)]         # $@, $<, $?, $^, $*, $(@D), $(@F), $(<D), $(<F)

        # 函数
        [$(<函数名> <参数,参数,...>)]
        [${<函数名> <参数,参数,...>}]

        # include 命令会将被包含的 Makefile 在当前位置完全展开
        [include <其他makefile>]

        # 回声（echoing） -- @# 这是测试 -- @echo TODO

        # 模式匹配。假定当前目录下有 f1.c 和 f2.c 两个源码文件，需要将它们编译为对应的对象文件
        %.o: %.c     # 等价于下面的写法
        f1.o: f1.c
        f2.o: f2.c

    环境变量与参数变量的区别: |
        参数变量赋值 > =/:=/+= 赋值 > 环境变量赋值 > ?= 赋值
        通常的做法是，将需要使用命令行传入的参数使用 ?= 赋值，并在命令行中使用环境变量修改为所需的值。
    库依赖的顺序:
        LIBS := -l(应用层lib) -l(基础lib) -l(系统lib)

  参考:
    - https://www.gnu.org/software/make/
    - https://www.ruanyifeng.com/blog/2015/02/make.html
    - https://soc.ustc.edu.cn/CECS/lab1/makefile/
    - https://blog.csdn.net/fangye945a/article/details/85039249
    - https://dlonng.com/posts/makefile

pkg-conf,pkgconf:
  介绍: 用于读取特定的.pc（Package Config）文件中库（libraries）的编译和链接信息命的令行工具，如在项目中使用外部库时，可以以此读取库的头文件（header files）和库文件（library files）的位置。
  参考:
    - https://github.com/pkgconf/pkgconf
    - https://people.freedesktop.org/~dbn/pkg-config-guide.html
    - https://zhuanlan.zhihu.com/p/661282452
  
readline: 
  - 一个库，它提供了在命令行中进行交互式输入的功能。它可以处理用户在命令行中的输入，并提供诸如命令历史记录、自动补全、编辑功能等特性，以增强用户在命令行界面中的交互体验。
  - 依赖 ncurses 库: https://ftp.gnu.org/gnu/ncurses/
  - readline 8.2 依赖 ncurses 的什么版本？ncurses 的最新版是 6.4

